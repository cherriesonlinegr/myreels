<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Αξιολόγησε το Reel — MyReels</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/review.css?v=2" />
</head>
<body>
  <main class="wrap">
    <p class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="13" fill="#FF5A5F"/><path fill="#fff" d="M9 19.2 20 10l11 9.2V30.2c0 1.1-.9 2-2 2H11c-1.1 0-2-.9-2-2V19.2z"/><path fill="#FF5A5F" d="M17.2 32.2v-5.4a2.8 2.8 0 0 1 5.6 0v5.4"/></svg>
      <span>LuxuryStayReels</span>
    </p>
    <section class="card" id="card">
      <h1>Αξιολόγησε το Reel</h1>
      <p class="lead">Πώς σου φάνηκε; Από 1 έως 5 αστέρια. Το κείμενο είναι προαιρετικό.</p>
      <p class="lead" id="status">Ανοίγει η φόρμα…</p>
    </section>
  </main>
  <script src="/cookies.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get("t") || "";
    const card = document.getElementById("card");
    const COPY = {
      el: {
        title: "Αξιολόγησε το Reel — MyReels",
        h1: "Αξιολόγησε το Reel",
        lead: "Πώς σου φάνηκε; Από 1 έως 5 αστέρια. Το κείμενο είναι προαιρετικό.",
        thanks: "Ευχαριστούμε.",
        of: "από 5",
        pick: "Διάλεξε αστέρια",
        legend: "Η ΒΑΘΜΟΛΟΓΙΑ ΣΟΥ",
        message: "Το μήνυμά σου",
        optional: "Προαιρετικό.",
        placeholder: "Π.χ. «Το Reel έπιασε ακριβώς το κατάλυμα.»",
        name: "Ονοματεπώνυμο",
        property: "Κατάλυμα",
        hide: "Προτιμώ να μην φαίνεται το ονοματεπώνυμό μου στην ιστοσελίδα.",
        submit: "Υποβολή αξιολόγησης",
        privacy: "Πολιτική Απορρήτου",
        privacyHref: "/privacy.html",
        pickError: "Διάλεξε από 1 έως 5 αστέρια.",
        tooLong: "Το κείμενο είναι πολύ μεγάλο.",
        notSent: "Δεν στάλθηκε.",
        already: "Την έχουμε ήδη.",
        seen: "Την είδαμε. Αν την εγκρίνουμε, θα φανεί πάνω από τα δείγματα.",
        badLink: "Αυτός ο σύνδεσμος δεν ανοίγει φόρμα.",
        failed: "Η φόρμα δεν άνοιξε. Ξαναπροσπάθησε σε λίγο.",
      },
      en: {
        title: "Rate the Reel — MyReels",
        h1: "Rate the Reel",
        lead: "How was it? From 1 to 5 stars. The text is optional.",
        thanks: "Thank you.",
        of: "of 5",
        pick: "Pick stars",
        legend: "YOUR RATING",
        message: "Your message",
        optional: "Optional.",
        placeholder: "For example, “The Reel caught the property exactly.”",
        name: "Full name",
        property: "Property",
        hide: "I prefer my full name not to appear on the website.",
        submit: "Submit rating",
        privacy: "Privacy policy",
        privacyHref: "/en/privacy",
        pickError: "Pick from 1 to 5 stars.",
        tooLong: "The text is too long.",
        notSent: "It wasn't sent.",
        already: "We already have it.",
        seen: "We saw it. If we approve it, it will appear above the samples.",
        badLink: "This link does not open a form.",
        failed: "The form didn't open. Try again in a moment.",
      },
    };
    let L = COPY.el;
    function useLang(lang) {
      L = lang === "en" ? COPY.en : COPY.el;
      document.documentElement.lang = lang === "en" ? "en" : "el";
      document.title = L.title;
    }

    const escapeHtml = (value) =>
      String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

    function showDone(text) {
      card.innerHTML = `<div class="done"><h1>${escapeHtml(L.thanks)}</h1><p>${escapeHtml(text)}</p></div>`;
      if (typeof placeDock === "function") placeDock();
    }

    function paintStars(form) {
      const picked = Number(form.querySelector("input[name='stars']:checked")?.value || 0);
      form.querySelectorAll(".stars label").forEach((label) => {
        label.classList.toggle("is-on", Number(label.dataset.star) <= picked);
      });
      const hint = form.querySelector("[data-star-hint]");
      if (hint) hint.textContent = picked ? `${picked} ${L.of}` : L.pick;
    }

    function showForm(data) {
      card.innerHTML = `
        <h1>${escapeHtml(L.h1)}</h1>
        <p class="lead">${escapeHtml(L.lead)}</p>
        <form id="review-form">
          <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <fieldset class="score">
            <legend>${escapeHtml(L.legend)}</legend>
            <div class="stars">
              ${[1, 2, 3, 4, 5].map((star) => `<label data-star="${star}"><input type="radio" name="stars" value="${star}" /><span aria-hidden="true">★</span></label>`).join("")}
            </div>
            <small data-star-hint>${escapeHtml(L.pick)}</small>
          </fieldset>
          <label class="field">${escapeHtml(L.message)}
            <span class="note">${escapeHtml(L.optional)}</span>
            <textarea name="message" maxlength="800" placeholder="${escapeHtml(L.placeholder)}"></textarea>
          </label>
          <label class="field">${escapeHtml(L.name)}
            <input type="text" readonly value="${escapeHtml(data.buyerName || "")}" />
          </label>
          <label class="field">${escapeHtml(L.property)}
            <input class="is-place" type="text" readonly value="${escapeHtml(data.property || "")}" />
          </label>
          <label class="privacy">
            <input type="checkbox" name="hideName" />
            <span>${escapeHtml(L.hide)}</span>
          </label>
          <button type="submit">${escapeHtml(L.submit)}</button>
          <p class="lead"><a href="${L.privacyHref}" target="_blank" rel="noopener">${escapeHtml(L.privacy)}</a></p>
          <p class="form-error" id="form-error" hidden></p>
        </form>
      `;
      const form = document.getElementById("review-form");
      form.addEventListener("change", () => paintStars(form));
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.getElementById("form-error");
        const stars = Number(form.querySelector("input[name='stars']:checked")?.value || 0);
        const message = form.message.value.trim();
        error.hidden = true;
        if (!stars) {
          error.hidden = false;
          error.textContent = L.pickError;
          return;
        }
        if (message.length > 800) {
          error.hidden = false;
          error.textContent = L.tooLong;
          return;
        }
        const button = form.querySelector("button");
        button.disabled = true;
        try {
          const response = await fetch("/api/review", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              token,
              stars,
              message,
              hideName: form.hideName.checked,
              website: form.website.value,
            }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.ok === false) throw new Error(L === COPY.en ? L.notSent : payload.error || L.notSent);
          showDone(payload.already ? L.already : L.seen);
        } catch (err) {
          error.hidden = false;
          error.textContent = err?.message || L.notSent;
          button.disabled = false;
        }
      });
      placeDock();
    }

    const dock = document.createElement("a");
    dock.className = "dock";
    dock.href = "#review-form";
    dock.hidden = true;
    dock.textContent = L.submit;
    document.body.append(dock);
    const placeDock = () => {
      const button = document.querySelector("#review-form button[type='submit']");
      if (!button || window.innerWidth > 959) {
        dock.hidden = true;
        return;
      }
      const box = button.getBoundingClientRect();
      const buttonShown = box.top < window.innerHeight - 12 && box.bottom > 48;
      dock.hidden = buttonShown;
      dock.textContent = button.textContent.trim() || L.submit;
    };
    dock.addEventListener("click", (event) => {
      event.preventDefault();
      document.querySelector("#review-form button[type='submit']")?.scrollIntoView({ behavior: "smooth", block: "center" });
      document.querySelector("#review-form button[type='submit']")?.focus({ preventScroll: true });
    });
    window.addEventListener("scroll", placeDock, { passive: true });
    window.addEventListener("resize", placeDock);

    fetch(`/api/review?t=${encodeURIComponent(token)}`)
      .then((response) => response.json().then((payload) => ({ ok: response.ok, payload })))
      .then(({ ok, payload }) => {
        if (!ok || payload.ok === false) {
          useLang("el");
          showDone(L.badLink);
          return;
        }
        useLang(payload.lang);
        if (payload.reviewed) {
          showDone(L.already);
          return;
        }
        showForm(payload);
      })
      .catch(() => showDone(L.failed));
  </script>
</body>
</html>
